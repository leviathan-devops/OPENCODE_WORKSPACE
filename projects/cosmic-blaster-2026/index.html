<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Blaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
        }
        #gameCanvas {
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff40, inset 0 0 60px #00ffff10;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 18, 0.95);
            color: #00ffff;
            text-align: center;
            pointer-events: auto;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
            animation: glow 2s ease-in-out infinite;
        }
        .overlay h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
        }
        .overlay p {
            font-size: 14px;
            margin: 8px 0;
            color: #aaa;
        }
        .overlay .score-display {
            font-size: 24px;
            color: #ff9933;
            margin: 15px 0;
        }
        .overlay .highlight {
            color: #33ff66;
            font-size: 18px;
            animation: blink 1s infinite;
        }
        .overlay .controls {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
            50% { text-shadow: 0 0 50px #00ffff, 0 0 100px #00ffff, 0 0 150px #00ffff; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
        }
        #hud.hidden { display: none; }
        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            font-size: 48px;
            text-shadow: 0 0 30px #00ffff;
        }
        #pauseOverlay.hidden { display: none; }
    </style>
</head>
<body>
    <div style="position: relative;">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud" class="hidden">
            <span>SCORE: <span id="score">00000000</span></span>
            <span>WAVE: <span id="wave">1</span></span>
            <span>HIGH: <span id="highScore">00000000</span></span>
            <span>LIVES: <span id="lives">3</span></span>
        </div>
        <div id="startScreen" class="overlay">
            <h1>COSMIC BLASTER</h1>
            <p class="highlight">PRESS ENTER TO START</p>
            <p style="margin-top: 20px; color: #ff9933;">High Score: <span id="startHighScore">0</span></p>
            <div class="controls">
                <p>ARROW KEYS / A,D - Move</p>
                <p>SPACEBAR - Fire</p>
                <p>P - Pause | M - Mute</p>
            </div>
        </div>
        <div id="gameOverScreen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p class="score-display">SCORE: <span id="finalScore">0</span></p>
            <p>WAVE REACHED: <span id="finalWave">1</span></p>
            <p style="color: #33ff66;">HIGH SCORE: <span id="finalHighScore">0</span></p>
            <p id="newHighScore" style="color: #ff9933; font-size: 20px; margin-top: 15px; display: none;">NEW HIGH SCORE!</p>
            <p class="highlight" style="margin-top: 30px;">PRESS ENTER TO RESTART</p>
        </div>
        <div id="pauseOverlay" class="hidden">PAUSED</div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const highScoreEl = document.getElementById('highScore');
    const livesEl = document.getElementById('lives');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const startHighScoreEl = document.getElementById('startHighScore');
    const finalScoreEl = document.getElementById('finalScore');
    const finalWaveEl = document.getElementById('finalWave');
    const finalHighScoreEl = document.getElementById('finalHighScore');
    const newHighScoreEl = document.getElementById('newHighScore');

    const GameState = { START: 0, PLAYING: 1, PAUSED: 2, GAME_OVER: 3 };
    let state = GameState.START;
    let score = 0;
    let wave = 1;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('cosmicBlasterHS')) || 0;
    let muted = false;
    let shakeIntensity = 0, shakeX = 0, shakeY = 0;

    const stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 2 + 0.5, speed: Math.random() * 30 + 10, brightness: Math.random() * 0.5 + 0.5 });
    }

    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, dur, type = 'square', vol = 0.1) {
        if (!audioCtx || muted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.value = vol;
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }
    function playNoise(dur, vol = 0.1) {
        if (!audioCtx || muted) return;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const g = audioCtx.createGain();
        g.gain.value = vol;
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        src.connect(g); g.connect(audioCtx.destination);
        src.start();
    }
    const sounds = {
        shoot: () => playTone(880, 0.08, 'square', 0.05),
        enemyShoot: () => playTone(220, 0.1, 'sawtooth', 0.03),
        explode: () => playNoise(0.15, 0.08),
        playerHit: () => { playTone(80, 0.4, 'sawtooth', 0.1); playNoise(0.2, 0.1); },
        step: (n) => playTone(50 + n * 20, 0.05, 'sawtooth', 0.03),
        ufo: () => playTone(400 + Math.sin(Date.now() * 0.01) * 100, 0.1, 'sine', 0.02)
    };

    const player = { x: W / 2, y: H - 60, width: 40, height: 30, speed: 400, invincible: 0, bullets: [], maxBullets: 3, shootCooldown: 0 };
    let enemies = [], enemyDirection = 1, enemyMoveTimer = 0, enemyMoveInterval = 800, enemyShootTimer = 0, enemyShootInterval = 1500, enemyBullets = [];
    let ufo = null, ufoTimer = 0;
    let barriers = [];
    let particles = [];
    const keys = { left: false, right: false, space: false };
    let spacePressed = false;
    let stepCounter = 0;

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === ' ') { e.preventDefault(); if (!spacePressed) { keys.space = true; spacePressed = true; } }
        if (e.key === 'Enter') { if (state === GameState.START || state === GameState.GAME_OVER) { initAudio(); startGame(); } }
        if (e.key === 'p' || e.key === 'P') { if (state === GameState.PLAYING) { state = GameState.PAUSED; pauseOverlay.classList.remove('hidden'); } else if (state === GameState.PAUSED) { state = GameState.PLAYING; pauseOverlay.classList.add('hidden'); } }
        if (e.key === 'm' || e.key === 'M') muted = !muted;
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === ' ') { keys.space = false; spacePressed = false; }
    });

    function startGame() {
        score = 0; wave = 1; lives = 3;
        state = GameState.PLAYING;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGame();
    }

    function initGame() {
        player.x = W / 2; player.y = H - 60; player.invincible = 0; player.bullets = []; player.shootCooldown = 0;
        enemies = []; enemyBullets = []; particles = []; ufo = null; ufoTimer = 0;
        
        const rows = 5, cols = 11, eW = 35, eH = 25, spX = 50, spY = 40;
        const startX = (W - (cols * spX)) / 2 + 10, startY = 80;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let type, color, pts;
                if (r === 0) { type = 'squid'; color = '#ff3366'; pts = 30; }
                else if (r <= 2) { type = 'crab'; color = '#ff9933'; pts = 20; }
                else { type = 'octopus'; color = '#33ff66'; pts = 10; }
                enemies.push({ x: startX + c * spX, y: startY + r * spY, width: eW, height: eH, type, color, points: pts, alive: true, frame: 0 });
            }
        }
        enemyDirection = 1; enemyMoveTimer = 0; enemyMoveInterval = Math.max(200, 800 - wave * 50); enemyShootTimer = 0; enemyShootInterval = Math.max(500, 1500 - wave * 100);
        
        barriers = [];
        const bW = 60, bH = 40, bY = H - 130, bSpace = (W - 4 * bW) / 5;
        for (let i = 0; i < 4; i++) {
            const bx = bSpace + i * (bW + bSpace);
            barriers.push({ x: bx, y: bY, width: bW, height: bH, pixels: createBarrierPixels(bx, bY, bW, bH) });
        }
        updateHUD();
    }

    function createBarrierPixels(x, y, w, h) {
        const pxs = [], cs = 8;
        for (let px = 0; px < w; px += cs) {
            for (let py = 0; py < h; py += cs) {
                const d = Math.abs(px - w/2), ah = h * 0.4;
                const inArch = py > h * 0.5 && d < ah * (1 - (py - h*0.5)/(h*0.5));
                if (!inArch) pxs.push({ x: px, y: py, alive: true });
            }
        }
        return pxs;
    }

    function updateHUD() {
        scoreEl.textContent = score.toString().padStart(8, '0');
        waveEl.textContent = wave;
        highScoreEl.textContent = highScore.toString().padStart(8, '0');
        livesEl.textContent = lives;
        startHighScoreEl.textContent = highScore;
    }

    function spawnParticles(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2, s = Math.random() * 150 + 50;
            particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, size: Math.random() * 4 + 2 });
        }
    }
    function shake(intensity) { shakeIntensity = Math.max(shakeIntensity, intensity); }

    function update(dt) {
        if (state !== GameState.PLAYING) return;
        if (shakeIntensity > 0) { shakeX = (Math.random() - 0.5) * shakeIntensity; shakeY = (Math.random() - 0.5) * shakeIntensity; shakeIntensity *= 0.9; if (shakeIntensity < 0.5) shakeIntensity = 0; }
        else { shakeX = shakeY = 0; }
        for (const s of stars) { s.y += s.speed * dt / 1000; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
        if (keys.left) player.x -= player.speed * dt / 1000;
        if (keys.right) player.x += player.speed * dt / 1000;
        player.x = Math.max(player.width/2, Math.min(W - player.width/2, player.x));
        if (player.invincible > 0) player.invincible -= dt;
        player.shootCooldown -= dt;
        if (keys.space && player.bullets.length < player.maxBullets && player.shootCooldown <= 0) {
            player.bullets.push({ x: player.x, y: player.y - player.height/2, width: 4, height: 15, speed: 600 });
            player.shootCooldown = 200;
            sounds.shoot();
        }
        for (let i = player.bullets.length - 1; i >= 0; i--) { const b = player.bullets[i]; b.y -= b.speed * dt / 1000; if (b.y < -20) player.bullets.splice(i, 1); }
        enemyMoveTimer += dt;
        if (enemyMoveTimer >= enemyMoveInterval) {
            enemyMoveTimer = 0; stepCounter++; sounds.step(stepCounter % 4);
            let drop = false;
            for (const e of enemies) { if (!e.alive) continue; if ((enemyDirection > 0 && e.x + e.width/2 > W - 20) || (enemyDirection < 0 && e.x - e.width/2 < 20)) { drop = true; break; } }
            if (drop) { enemyDirection *= -1; for (const e of enemies) if (e.alive) e.y += 20; }
            else { for (const e of enemies) if (e.alive) e.x += enemyDirection * 15; }
            for (const e of enemies) e.frame = (e.frame + 1) % 2;
        }
        enemyShootTimer += dt;
        if (enemyShootTimer >= enemyShootInterval && enemies.some(e => e.alive)) {
            enemyShootTimer = 0;
            const alive = enemies.filter(e => e.alive);
            const s = alive[Math.floor(Math.random() * alive.length)];
            enemyBullets.push({ x: s.x, y: s.y + s.height/2, width: 4, height: 12, speed: 250 + wave * 20 });
            sounds.enemyShoot();
        }
        for (let i = enemyBullets.length - 1; i >= 0; i--) { const b = enemyBullets[i]; b.y += b.speed * dt / 1000; if (b.y > H + 20) enemyBullets.splice(i, 1); }
        ufoTimer += dt;
        if (!ufo && ufoTimer > 15000 + Math.random() * 10000) { ufo = { x: -50, y: 50, width: 50, height: 20, speed: 150, points: Math.floor(Math.random() * 3) * 100 + 100, dir: 1 }; ufoTimer = 0; }
        if (ufo) { ufo.x += ufo.speed * ufo.dir * dt / 1000; sounds.ufo(); if (ufo.x > W + 50) ufo = null; }
        for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.vy += 200 * dt / 1000; p.life -= dt / 500; if (p.life <= 0) particles.splice(i, 1); }
        for (let i = player.bullets.length - 1; i >= 0; i--) { const b = player.bullets[i]; for (const e of enemies) { if (!e.alive) continue; if (b.x > e.x - e.width/2 && b.x < e.x + e.width/2 && b.y > e.y - e.height/2 && b.y < e.y + e.height/2) { e.alive = false; player.bullets.splice(i, 1); score += e.points; spawnParticles(e.x, e.y, e.color, 15); shake(5); sounds.explode(); updateHUD(); break; } } }
        for (let i = player.bullets.length - 1; i >= 0; i--) { const b = player.bullets[i]; if (ufo && b.x > ufo.x - ufo.width/2 && b.x < ufo.x + ufo.width/2 && b.y > ufo.y - ufo.height/2 && b.y < ufo.y + ufo.height/2) { score += ufo.points; spawnParticles(ufo.x, ufo.y, '#ff00ff', 20); shake(8); sounds.explode(); ufo = null; player.bullets.splice(i, 1); updateHUD(); } }
        for (let i = player.bullets.length - 1; i >= 0; i--) { const b = player.bullets[i]; for (const barrier of barriers) { for (let j = barrier.pixels.length - 1; j >= 0; j--) { const p = barrier.pixels[j]; if (!p.alive) continue; if (b.x > barrier.x + p.x && b.x < barrier.x + p.x + 8 && b.y > barrier.y + p.y && b.y < barrier.y + p.y + 8) { p.alive = false; player.bullets.splice(i, 1); break; } } } }
        for (let i = enemyBullets.length - 1; i >= 0; i--) { const b = enemyBullets[i]; for (const barrier of barriers) { for (let j = barrier.pixels.length - 1; j >= 0; j--) { const p = barrier.pixels[j]; if (!p.alive) continue; if (b.x > barrier.x + p.x && b.x < barrier.x + p.x + 8 && b.y > barrier.y + p.y && b.y < barrier.y + p.y + 8) { p.alive = false; enemyBullets.splice(i, 1); break; } } } }
        if (player.invincible <= 0) { for (let i = enemyBullets.length - 1; i >= 0; i--) { const b = enemyBullets[i]; if (Math.abs(b.x - player.x) < player.width/2 && Math.abs(b.y - player.y) < player.height/2) { enemyBullets.splice(i, 1); lives--; player.invincible = 2000; spawnParticles(player.x, player.y, '#00ffff', 20); shake(15); sounds.playerHit(); updateHUD(); if (lives <= 0) { gameOver(); } break; } } }
        for (const e of enemies) { if (!e.alive) continue; if (e.y + e.height/2 > player.y - player.height || (Math.abs(e.x - player.x) < (e.width + player.width)/2 && Math.abs(e.y - player.y) < (e.height + player.height)/2)) { lives = 0; updateHUD(); gameOver(); return; } }
        if (enemies.every(e => !e.alive)) { score += 1000; wave++; updateHUD(); spawnParticles(W/2, H/2, '#ffff00', 50); shake(10); sounds.explode(); initGame(); }
    }

    function gameOver() {
        state = GameState.GAME_OVER;
        hud.classList.add('hidden');
        finalScoreEl.textContent = score;
        finalWaveEl.textContent = wave;
        finalHighScoreEl.textContent = highScore;
        if (score > highScore) { highScore = score; localStorage.setItem('cosmicBlasterHS', highScore); newHighScoreEl.style.display = 'block'; }
        else { newHighScoreEl.style.display = 'none'; }
        gameOverScreen.classList.remove('hidden');
    }

    function drawPlayer() {
        if (player.invincible > 0 && Math.floor(player.invincible / 100) % 2 === 0) return;
        ctx.save();
        ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.height/2);
        ctx.lineTo(player.x - player.width/2, player.y + player.height/2);
        ctx.lineTo(player.x - player.width/4, player.y + player.height/3);
        ctx.lineTo(player.x + player.width/4, player.y + player.height/3);
        ctx.lineTo(player.x + player.width/2, player.y + player.height/2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(player.x, player.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff9933'; ctx.shadowColor = '#ff9933';
        ctx.beginPath(); ctx.ellipse(player.x, player.y + player.height/2 + 5, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function drawEnemy(e) {
        ctx.save();
        ctx.shadowColor = e.color; ctx.shadowBlur = 10; ctx.fillStyle = e.color;
        const x = e.x, y = e.y, w = e.width, h = e.height;
        if (e.type === 'squid') {
            ctx.fillRect(x - w/6, y - h/3, w/3, h/2);
            ctx.fillRect(x + w/6, y - h/3, w/3, h/2);
            ctx.fillRect(x - w/2, y, w, h/3);
            if (e.frame === 0) { ctx.fillRect(x - w/2, y + h/3, w/4, h/3); ctx.fillRect(x + w/4, y + h/3, w/4, h/3); }
            else { ctx.fillRect(x - w/3, y + h/3, w/4, h/3); ctx.fillRect(x + w/12, y + h/3, w/4, h/3); }
        } else if (e.type === 'crab') {
            ctx.fillRect(x - w/3, y - h/4, w/1.5, h/2);
            ctx.fillRect(x - w/2, y - h/3, w/5, h/2);
            ctx.fillRect(x + w/2 - w/5, y - h/3, w/5, h/2);
            if (e.frame === 0) { ctx.fillRect(x - w/2, y + h/6, w/5, h/3); ctx.fillRect(x + w/2 - w/5, y + h/6, w/5, h/3); }
            else { ctx.fillRect(x - w/2 + 5, y + h/6, w/5, h/3); ctx.fillRect(x + w/2 - w/5 - 5, y + h/6, w/5, h/3); }
        } else {
            ctx.beginPath(); ctx.ellipse(x, y - h/6, w/2.5, h/3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(x - w/3, y, w/1.5, h/4);
            if (e.frame === 0) { ctx.fillRect(x - w/2, y + h/6, w/5, h/4); ctx.fillRect(x + w/2 - w/5, y + h/6, w/5, h/4); ctx.fillRect(x - w/6, y + h/6, w/3, h/4); }
            else { ctx.fillRect(x - w/2, y + h/6, w/4, h/4); ctx.fillRect(x + w/4, y + h/6, w/4, h/4); ctx.fillRect(x - w/5, y + h/6, w/2.5, h/4); }
        }
        ctx.fillStyle = '#000'; ctx.fillRect(x - w/6, y - h/6, 4, 4); ctx.fillRect(x + w/6 - 4, y - h/6, 4, 4);
        ctx.restore();
    }

    function drawUFO() {
        if (!ufo) return;
        ctx.save();
        ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 30; ctx.fillStyle = '#ff00ff';
        ctx.beginPath(); ctx.ellipse(ufo.x, ufo.y, ufo.width/2, ufo.height/2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#00ffff';
        ctx.beginPath(); ctx.ellipse(ufo.x, ufo.y, ufo.width/3, ufo.height/4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function drawBarriers() {
        for (const barrier of barriers) {
            ctx.fillStyle = '#33ff66'; ctx.shadowColor = '#33ff66'; ctx.shadowBlur = 5;
            for (const p of barrier.pixels) { if (p.alive) ctx.fillRect(barrier.x + p.x, barrier.y + p.y, 8, 8); }
        }
        ctx.shadowBlur = 0;
    }

    function drawBullets() {
        ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
        for (const b of player.bullets) ctx.fillRect(b.x - b.width/2, b.y - b.height/2, b.width, b.height);
        ctx.fillStyle = '#ff3366'; ctx.shadowColor = '#ff3366';
        for (const b of enemyBullets) ctx.fillRect(b.x - b.width/2, b.y - b.height/2, b.width, b.height);
        ctx.shadowBlur = 0;
    }

    function drawParticles() {
        for (const p of particles) { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); }
        ctx.globalAlpha = 1;
    }

    function drawStars() {
        for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.brightness})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); }
    }

    function drawScanlines() {
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
    }

    function render() {
        ctx.save(); ctx.translate(shakeX, shakeY);
        ctx.fillStyle = '#0a0a12'; ctx.fillRect(-10, -10, W + 20, H + 20);
        drawStars();
        if (state === GameState.PLAYING || state === GameState.PAUSED) {
            for (const e of enemies) if (e.alive) drawEnemy(e);
            drawUFO(); drawBarriers(); drawPlayer(); drawBullets(); drawParticles(); drawScanlines();
        } else { drawScanlines(); }
        ctx.restore();
    }

    let lastTime = 0;
    function gameLoop(ts) {
        const dt = lastTime === 0 ? 16.67 : Math.min(ts - lastTime, 100);
        lastTime = ts;
        update(dt); render();
        requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop(0);
    </script>
</body>
</html>
