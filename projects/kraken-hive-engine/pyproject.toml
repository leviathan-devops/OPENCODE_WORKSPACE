[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kraken-hive"
version = "0.1.0"
description = "Kraken Ultra integration for Hive framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.0",
    "ruff>=0.3.0",
]

[project.scripts]
kraken-hive = "kraken.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kraken"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
