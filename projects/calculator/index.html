<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      font-family: 'Orbitron', sans-serif;
    }

    .calculator {
      background: #16213e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(233, 69, 96, 0.3);
      width: 320px;
    }

    .display {
      background: #0f3460;
      color: #e94560;
      font-size: 2rem;
      font-weight: bold;
      text-align: right;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      min-height: 70px;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      border: 2px solid #e94560;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Orbitron', sans-serif;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
    }

    button:active {
      transform: scale(0.95);
    }

    .number {
      background: #1a1a2e;
      color: #e94560;
    }

    .operator {
      background: #e94560;
      color: #1a1a2e;
      border-color: #e94560;
    }

    .operator:hover {
      background: #ff6b8a;
      border-color: #ff6b8a;
    }

    .equals {
      background: #e94560;
      color: #fff;
      grid-column: span 2;
    }

    .clear {
      background: #e94560;
      color: #fff;
      grid-column: span 2;
    }

    .decimal {
      background: #1a1a2e;
      color: #e94560;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="setOperator('/')">÷</button>
      <button class="operator" onclick="setOperator('*')">×</button>

      <button class="number" onclick="appendNumber('7')">7</button>
      <button class="number" onclick="appendNumber('8')">8</button>
      <button class="number" onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="setOperator('-')">-</button>

      <button class="number" onclick="appendNumber('4')">4</button>
      <button class="number" onclick="appendNumber('5')">5</button>
      <button class="number" onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="setOperator('+')">+</button>

      <button class="number" onclick="appendNumber('1')">1</button>
      <button class="number" onclick="appendNumber('2')">2</button>
      <button class="number" onclick="appendNumber('3')">3</button>
      <button class="decimal" onclick="appendNumber('.')">.</button>

      <button class="number" onclick="appendNumber('0')">0</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';
    let firstOperand = null;
    let operator = null;
    let waitingForSecondOperand = false;

    function updateDisplay() {
      display.textContent = currentInput.length > 12 
        ? currentInput.substring(0, 12) 
        : currentInput;
    }

    function appendNumber(num) {
      if (waitingForSecondOperand) {
        currentInput = num === '.' ? '0.' : num;
        waitingForSecondOperand = false;
      } else {
        if (num === '.' && currentInput.includes('.')) return;
        currentInput = currentInput === '0' && num !== '.' 
          ? num 
          : currentInput + num;
      }
      updateDisplay();
    }

    function setOperator(op) {
      if (firstOperand !== null && !waitingForSecondOperand) {
        calculate();
      }
      firstOperand = parseFloat(currentInput);
      operator = op;
      waitingForSecondOperand = true;
    }

    function calculate() {
      if (operator === null || firstOperand === null) return;
      
      const secondOperand = parseFloat(currentInput);
      let result;
      
      switch (operator) {
        case '+': result = firstOperand + secondOperand; break;
        case '-': result = firstOperand - secondOperand; break;
        case '*': result = firstOperand * secondOperand; break;
        case '/': result = secondOperand === 0 ? 'Error' : firstOperand / secondOperand; break;
      }
      
      currentInput = result === 'Error' ? 'Error' : String(result).length > 12 
        ? String(result).substring(0, 12) 
        : String(result);
      
      operator = null;
      firstOperand = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }
  </script>
</body>
</html>
